<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Kaydet</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/kaydet-32.png" />
    <link rel="apple-touch-icon" href="/brand/kaydet-192.png" />
    <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Resolve the theme before first paint (no flash). Mirrors src/theme/themeStorage.ts.
      // Mobile default is dark (AppThemeMode.dark); 'system' follows the OS.
      (function () {
        var mode = 'dark';
        try {
          mode = localStorage.getItem('kaydet.themeMode') || 'dark';
        } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
